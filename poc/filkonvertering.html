<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Filkonvertering | Ena Agents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css?v=12" />
    <link rel="stylesheet" href="../css/poc.css?v=30" />
    <link rel="stylesheet" href="../css/filkonvertering.css?v=8" />
  </head>
  <body class="convert-page">
    <div class="app">
      <aside class="sidebar">
        <div class="brand-block">
          <a class="brand-logo-link" href="../index.html">
            <img
              class="brand-logo"
              src="../images/DIGG-logo-color.svg"
              alt="DIGG – Myndigheten för digital förvaltning, till startsidan"
            />
          </a>
          <span class="brand-title">Ena Agents</span>
        </div>

        <nav class="side-nav" aria-label="Navigation">
          <a class="nav-item nav-link" href="../index.html">Fråga agenten</a>
          <div class="nav-group">
            <a class="nav-item nav-link" id="guide-link" href="steg-for-steg.html">
              Guidad anslutning
            </a>
            <a class="nav-subitem nav-link" id="underlag-link" href="steg-underlag.html">
              Underlag
            </a>
            <a
              class="nav-subitem nav-link active"
              id="convert-link"
              href="filkonvertering.html"
              aria-current="page"
            >
              Filkonvertering
            </a>
          </div>
        </nav>
      </aside>

      <main class="chat-panel guide-shell convert-shell">
        <header class="context-header underlag-hero convert-hero">
          <svg
            class="underlag-hero-shapes"
            viewBox="0 0 1000 160"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            <polygon points="840,0 1000,0 1000,160 790,160" fill="#cd796d" />
            <polygon points="700,0 840,0 790,160" fill="#2f3c2d" />
          </svg>
          <div class="underlag-hero-copy">
            <p class="eyebrow">Guidad anslutning</p>
            <h1>Filkonvertering</h1>
          </div>
        </header>

        <section class="convert-workspace" aria-label="Filkonvertering">
          <article class="convert-pane" id="digg-pane" aria-labelledby="digg-title">
            <header class="convert-pane-header">
              <h2 id="digg-title">DIGG-fil</h2>
              <div class="convert-toolbar">
                <button class="convert-chip" type="button" id="digg-reformat-btn">
                  Reformat
                </button>
                <button class="convert-chip convert-chip-primary" type="button" id="digg-pdf-btn">
                  <svg class="convert-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M12 4v10M8 10l4 4 4-4M6 19h12"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                  Ladda ner PDF
                </button>
              </div>
            </header>
            <div class="convert-pane-body" id="digg-scroll">
              <div class="convert-document" id="digg-document"></div>
            </div>
          </article>

          <div
            class="convert-divider"
            id="convert-divider"
            role="separator"
            aria-orientation="vertical"
            aria-label="Ändra panelbredd"
            aria-controls="digg-pane kommun-pane"
            tabindex="0"
          >
            <button
              class="convert-divider-btn"
              type="button"
              id="divider-left-btn"
              aria-label="Gör Kommun-panelen bredare"
              title="Gör Kommun-panelen bredare"
            >
              ←
            </button>
            <button
              class="convert-divider-btn"
              type="button"
              id="divider-right-btn"
              aria-label="Gör DIGG-panelen bredare"
              title="Gör DIGG-panelen bredare"
            >
              →
            </button>
          </div>

          <article class="convert-pane" id="kommun-pane" aria-labelledby="kommun-title">
            <header class="convert-pane-header">
              <h2 id="kommun-title">Kommun SDK-fil (JSON)</h2>
              <div class="convert-toolbar">
                <button class="convert-icon-btn" type="button" id="undo-btn" aria-label="Ångra" title="Ångra">
                  <svg class="convert-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 8H5V5M5.5 8.5A7 7 0 1 1 7 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </button>
                <button class="convert-icon-btn" type="button" id="redo-btn" aria-label="Gör om" title="Gör om">
                  <svg class="convert-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M16 8h3V5M18.5 8.5A7 7 0 1 0 17 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </button>
                <div class="convert-tabs" role="tablist" aria-label="Visningsläge för JSON">
                  <button
                    class="convert-tab is-active"
                    type="button"
                    role="tab"
                    id="tab-code"
                    aria-selected="true"
                    aria-controls="json-code-panel"
                  >
                    Code
                  </button>
                  <button
                    class="convert-tab"
                    type="button"
                    role="tab"
                    id="tab-visual"
                    aria-selected="false"
                    aria-controls="json-visual-panel"
                  >
                    Visual
                  </button>
                </div>
                <button class="convert-chip" type="button" id="json-reformat-btn">
                  Reformat
                </button>
                <label class="convert-chip convert-chip-primary convert-upload" for="json-file-input">
                  Ladda upp JSON
                </label>
                <input
                  class="visually-hidden"
                  id="json-file-input"
                  type="file"
                  accept=".json,application/json"
                />
              </div>
            </header>
            <p class="convert-status" id="json-status" role="status"></p>
            <div class="json-file-bar" id="json-file-bar" hidden>
              <div class="json-file-tab is-active" title="Öppen JSON-fil">
                <svg class="json-file-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M7 3.5h7l5 5V20.5H7z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M14 3.5V9h5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linejoin="round"
                  />
                </svg>
                <span class="json-file-name" id="json-file-name">untitled.json</span>
                <span class="json-file-dirty" id="json-file-dirty" hidden>*</span>
                <button
                  class="json-file-close"
                  type="button"
                  id="json-file-close"
                  aria-label="Stäng fil"
                  title="Stäng fil"
                >
                  ×
                </button>
              </div>
            </div>
            <div class="convert-pane-body">
              <div class="json-code-panel" id="json-code-panel" role="tabpanel" aria-labelledby="tab-code">
                <div class="json-editor" id="json-editor">
                  <pre class="json-gutter" id="json-gutter" aria-hidden="true">1</pre>
                  <div class="json-code-wrap">
                    <pre class="json-highlight" id="json-highlight" aria-hidden="true"></pre>
                    <textarea
                      class="json-input"
                      id="json-input"
                      spellcheck="false"
                      autocapitalize="off"
                      autocomplete="off"
                      aria-label="JSON-kod för Kommun SDK-fil"
                      placeholder="Klistra in eller skriv Kommun SDK-JSON här."
                    ></textarea>
                  </div>
                </div>
              </div>
              <div
                class="json-visual-panel"
                id="json-visual-panel"
                role="tabpanel"
                aria-labelledby="tab-visual"
                hidden
              ></div>
            </div>
          </article>
        </section>
      </main>
    </div>

    <script src="../js/filkonvertering.js?v=5"></script>
  </body>
</html>
