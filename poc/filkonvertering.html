<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Filkonvertering har flyttat | Ena Agents</title>
  <link rel="stylesheet" href="../css/style.css?v=15">
  <style>
    body { min-height:100dvh; display:grid; place-items:center; padding:24px; }
    main { width:min(100%,540px); padding:32px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); }
    h1 { font-size:1.5rem; margin:0 0 16px; line-height:1.3; }
    p { line-height:1.65; }
    a { display:inline-block; margin-top:8px; padding:12px 16px; background:var(--accent); color:#fff; border-radius:var(--radius); text-decoration:none; }
    a:hover { background:var(--accent-hover); }
    a:focus-visible { outline:3px solid var(--focus-color); outline-offset:4px; }
  </style>
</head>
<body>
  <main aria-labelledby="moved-title">
    <h1 id="moved-title">Filkonvertering finns nu i Underlagsverkstad</h1>
    <p>Redigera filer, kontrollera innehåll och skapa en läsbar sammanställning på samma plats.</p>
    <p id="redirect-status" role="status">Du skickas vidare till sammanställningen.</p>
    <a id="workshop-redirect" href="reformat-workspace.html?view=summary">Öppna Underlagsverkstad</a>
    <noscript><p>JavaScript är avstängt. Använd länken ovan och öppna verkstaden från ditt ärendes underlag om du behöver välja ärende.</p></noscript>
  </main>
  <script>
    (function () {
      "use strict";
      const incoming = new URLSearchParams(window.location.search);
      const target = new URL("reformat-workspace.html", window.location.href);
      const safeText = function (value, limit) {
        return typeof value === "string" && value.length <= limit && !/[\u0000-\u001f\u007f]/.test(value) ? value : "";
      };
      let selectedCase = "";
      try { selectedCase = localStorage.getItem("digg-selected-case-v3") || ""; } catch (_) { /* The URL still works when browser storage is unavailable. */ }
      const caseId = safeText(incoming.get("case") || selectedCase, 120);
      if (caseId) target.searchParams.set("case", caseId);
      const asset = incoming.get("asset") || "";
      if (/^[a-z0-9][a-z0-9_-]{0,79}$/i.test(asset)) target.searchParams.set("asset", asset);
      const views = new Set(["files", "summary", "recipients"]);
      const requestedView = incoming.get("view");
      target.searchParams.set("view", views.has(requestedView) ? requestedView : "summary");
      document.getElementById("workshop-redirect").href = target.href;
      window.location.replace(target.href);
    })();
  </script>
</body>
</html>
