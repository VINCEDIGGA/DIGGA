<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Ena Agents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=15" />
  </head>
  <body class="chat-page">
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-mobile-bar">
          <button
            type="button"
            class="sidebar-toggle"
            id="sidebar-toggle"
            aria-expanded="false"
            aria-controls="sidebar-panel"
          >
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M4 7h16M4 12h16M4 17h16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
            <span>Meny</span>
          </button>
          <span class="sidebar-mobile-title">Ena Agents</span>
          <a class="sidebar-mobile-logo" href="index.html">
            <img
              src="images/DIGG-logo-color.svg"
              alt="DIGG – Myndigheten för digital förvaltning, till startsidan"
            />
          </a>
        </div>
        <div class="sidebar-panel" id="sidebar-panel">
        <div class="brand-block">
          <a class="brand-logo-link" href="index.html">
            <img
              class="brand-logo"
              src="images/DIGG-logo-color.svg"
              alt="DIGG – Myndigheten för digital förvaltning, till startsidan"
            />
          </a>
          <span class="brand-title">Ena Agents</span>
        </div>

        <nav class="side-nav">
          <button type="button" class="nav-item" id="new-case-btn">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 5v14M5 12h14"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
            Nytt ärende
          </button>
          <button type="button" class="nav-item" id="archive-view-btn">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path d="M12 8v5l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            Arkiv
          </button>
          <button type="button" class="nav-item" id="ongoing-view-btn">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M5 7h14v9a2 2 0 0 1-2 2H9l-4 3V7z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
            </svg>
            Pågående ärenden
          </button>
        </nav>

        <p class="notice" id="limit-notice" hidden>
          Högst två pågående ärenden.
        </p>

        <div class="list-section">
          <ul class="case-list" id="case-list"></ul>
        </div>
        </div>
      </aside>

      <main class="chat-panel">
        <section class="chat is-empty" id="chat-view">
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-center">
            <p class="chat-intro">Fråga om SDK, certifikat eller leverantörer</p>
          </div>
          <form class="chat-form" id="chat-form">
            <label class="btn-attach" id="attach-btn" for="file-input">
              <span class="visually-hidden">Bifoga fil</span>
              <span aria-hidden="true">+</span>
            </label>
            <label class="visually-hidden" for="message-input">Fråga</label>
            <input
              id="message-input"
              type="text"
              autocomplete="off"
              placeholder="Skriv din fråga här"
            />
            <button type="submit" class="btn-send" aria-label="Skicka">
              ↑
            </button>
          </form>
          <input
            id="file-input"
            class="visually-hidden"
            type="file"
            accept=".txt,.md,.json,.yaml,.yml,.csv,.xml,.pdf,.doc,.docx"
          />
          <div class="attach-bar" id="attach-bar" hidden>
            <p class="attach-file-info">
              <span class="attach-file-name" id="attach-file-name"></span>
              <span class="attach-file-size" id="attach-file-size"></span>
            </p>
            <div class="attach-file-actions">
              <button type="button" class="attach-replace-btn" id="attach-replace-btn">
                Byt fil
              </button>
              <button
                type="button"
                class="attach-remove-btn"
                id="attach-remove-btn"
                aria-label="Ta bort bifogad fil"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M6 6l12 12M18 6L6 18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <dialog class="modal" id="info-dialog">
      <form method="dialog" class="modal-content">
        <p id="info-text"></p>
        <button type="submit" class="btn-primary">OK</button>
      </form>
    </dialog>

    <script src="js/config.js?v=3"></script>
    <script src="js/api.js?v=9"></script>
    <script src="js/app.js?v=15"></script>
  </body>
</html>
